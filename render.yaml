services:
  # Frontend - React SPA
  - type: web
    name: smartslip-frontend
    env: static
    buildCommand: cd receipt-scanner && npm install && npm run build
    staticPublishPath: receipt-scanner/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend - Node.js/Express API
  - type: web
    name: smartslip-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
